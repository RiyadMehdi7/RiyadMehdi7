<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Riyad Mehdiyev, Applied AI Systems</title>
  <desc id="desc">Editorial dark banner presenting Riyad Mehdiyev as an applied AI systems builder working across causal, temporal, agentic, and production systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09100e"/>
      <stop offset="0.55" stop-color="#101916"/>
      <stop offset="1" stop-color="#07100f"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="18%" r="70%">
      <stop offset="0" stop-color="#62e6a7" stop-opacity=".17"/>
      <stop offset=".48" stop-color="#62e6a7" stop-opacity=".04"/>
      <stop offset="1" stop-color="#62e6a7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#b8c7c0" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <path d="M0 287C176 242 314 318 486 277S806 208 1200 248" fill="none" stroke="#62e6a7" stroke-opacity=".12" stroke-width="2"/>
  <path d="M0 304C185 258 331 332 515 289S854 228 1200 266" fill="none" stroke="#ffcc66" stroke-opacity=".08"/>

  <g transform="translate(64 55)">
    <circle cx="5" cy="5" r="5" fill="#62e6a7"/>
    <text x="22" y="10" fill="#9fb1aa" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" letter-spacing="2.6">STOCKHOLM / APPLIED AI SYSTEMS</text>

    <text x="0" y="102" fill="#f4f0e6" font-family="Georgia,'Times New Roman',serif" font-size="66" font-weight="700" letter-spacing="-2">Riyad Mehdiyev</text>
    <text x="2" y="145" fill="#aab8b2" font-family="'SFMono-Regular',Consolas,monospace" font-size="17" letter-spacing=".8">I build decision systems that reason under uncertainty, time, and real constraints.</text>

    <g transform="translate(0 194)" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" letter-spacing="1.4">
      <rect width="114" height="34" rx="17" fill="#62e6a7" fill-opacity=".1" stroke="#62e6a7" stroke-opacity=".38"/>
      <text x="20" y="22" fill="#8df3bf">CAUSAL</text>

      <rect x="126" width="130" height="34" rx="17" fill="#62e6a7" fill-opacity=".1" stroke="#62e6a7" stroke-opacity=".38"/>
      <text x="146" y="22" fill="#8df3bf">TEMPORAL</text>

      <rect x="268" width="126" height="34" rx="17" fill="#ffcc66" fill-opacity=".08" stroke="#ffcc66" stroke-opacity=".34"/>
      <text x="288" y="22" fill="#ffda8a">AGENTIC</text>

      <rect x="406" width="148" height="34" rx="17" fill="#f4f0e6" fill-opacity=".06" stroke="#f4f0e6" stroke-opacity=".24"/>
      <text x="426" y="22" fill="#d7ddd9">PRODUCTION</text>
    </g>
  </g>

  <g transform="translate(932 59)">
    <circle cx="92" cy="92" r="90" fill="none" stroke="#62e6a7" stroke-opacity=".12"/>
    <circle cx="92" cy="92" r="62" fill="none" stroke="#62e6a7" stroke-opacity=".2" stroke-dasharray="4 7"/>
    <circle cx="92" cy="92" r="30" fill="#62e6a7" fill-opacity=".08" stroke="#62e6a7" stroke-opacity=".42"/>
    <path d="M92 2V182M2 92H182" stroke="#62e6a7" stroke-opacity=".09"/>
    <path d="M92 92L146 45" stroke="#ffcc66" stroke-opacity=".75" stroke-width="2"/>
    <circle cx="146" cy="45" r="5" fill="#ffcc66"/>
    <circle cx="92" cy="92" r="4" fill="#62e6a7"/>
    <text x="92" y="210" text-anchor="middle" fill="#71827b" font-family="'SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="2">SIGNAL OVER NOISE</text>
  </g>

  <g transform="translate(64 322)" fill="#65756e" font-family="'SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="1.8">
    <text>RESEARCH → SYSTEM → PRODUCT</text>
    <text x="889">BUILD / MEASURE / SHIP</text>
  </g>
</svg>
